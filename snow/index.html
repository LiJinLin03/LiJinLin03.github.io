<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src blob:; img-src data:; base-uri 'none'; form-action 'none'">
<title>雪协面试资料 · 访问验证</title>
<style>
:root{color-scheme:light;--ink:#182d44;--muted:#758499;--line:#dfe7ee;--accent:#1b5670}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#f4f7fa;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
[hidden]{display:none!important}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:wait;opacity:.65}
button:focus-visible,input:focus-visible{outline:3px solid #6a9dbb;outline-offset:3px}
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 20px;background:radial-gradient(ellipse at 50% 10%,#e8f1f7,transparent 62%)}
.gate-inner{width:100%;max-width:410px}
.brand{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:10px;letter-spacing:1.9px;margin-bottom:26px}
.brand svg{width:32px;height:28px;flex:none}
.card{padding:34px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 40px #233c550a}
.lock-mark{display:flex;width:42px;height:42px;align-items:center;justify-content:center;border:1px solid #dce7ee;border-radius:11px;background:#f2f7fa;color:var(--accent);margin-bottom:19px}
.lock-mark svg{width:22px;height:22px}
h1{font-size:24px;font-weight:700;letter-spacing:.5px;margin:0 0 7px}
.intro{margin:0 0 27px;font-size:13px;color:var(--muted)}
label{display:block;margin-bottom:8px;color:#51657c;font-size:12px}
.password-field{display:flex;align-items:center;border:1px solid #cedbe5;border-radius:8px;background:#fbfcfe}
.password-field:focus-within{border-color:#6b96b2;background:#fff}
#password{width:100%;min-width:0;border:0;background:transparent;padding:12px 13px;outline:none;font-size:16px;color:var(--ink)}
#togglePassword{background:transparent;border:0;color:#688197;font-size:12px;white-space:nowrap;padding:10px 12px}
.error{color:#a34046;font-size:12px;margin:9px 0 0}
#unlock{display:block;width:100%;padding:12px 18px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:600;margin-top:20px}
#unlock:hover:not(:disabled){background:#234865}
.note{font-size:11px;color:#8b98a7;margin:19px 0 0;line-height:1.9}
.footer{text-align:center;margin-top:21px;color:#8795a6;font-size:11px;letter-spacing:.2px}
.toolbar{position:fixed;inset:0 0 auto;height:43px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;z-index:5}
.toolbar-title{font-size:12px;font-weight:600;color:#46647c}
.toolbar-title span{font-weight:400;color:#8a98a7;margin-left:10px;font-size:11px}
#lock{padding:4px 12px;border:1px solid #d5e1e9;background:#f5f8fb;color:#46647c;border-radius:6px;font-size:12px}
.viewer{position:fixed;inset:43px 0 0}
.viewer iframe{display:block;width:100%;height:100%;border:0;background:#f4f7fa}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){.card{padding:28px 24px}.gate{padding:24px 18px}.brand{font-size:9px;letter-spacing:1.5px}.toolbar{padding:0 16px}}
</style>
</head>
<body>
<main class="gate" id="gate">
  <div class="gate-inner">
    <div class="brand">
      <svg viewBox="0 0 32 28" fill="none" aria-hidden="true"><path d="M2 24 14 4l5 9 4-6 8 17H2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m9 12 5 3 3-5M20 13l3 3 3-2" stroke="currentColor" stroke-width="1.5"/></svg>
      PKU SKI ASSOCIATION
    </div>
    <section class="card" aria-labelledby="gateTitle">
      <div class="lock-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      <h1 id="gateTitle">雪协面试资料</h1>
      <p class="intro">输入访问密码，查看面试人员总览。</p>
      <form id="accessForm">
        <label for="password">访问密码</label>
        <div class="password-field">
          <input id="password" type="password" required autocomplete="off" spellcheck="false" autocapitalize="none" aria-describedby="error" placeholder="请输入密码">
          <button type="button" id="togglePassword" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
        <button type="submit" id="unlock">解锁资料 →</button>
      </form>
      <p class="note">刷新或锁定后需重新输入密码。<br>请在使用完毕后点击“锁定”。</p>
      <noscript><p class="error">请使用已启用 JavaScript 的浏览器打开此页面。</p></noscript>
    </section>
    <div class="footer">26–27 雪协招新</div>
  </div>
</main>
<header class="toolbar" id="toolbar" hidden>
  <div class="toolbar-title">面试资料<span>已解锁</span></div>
  <button type="button" id="lock">锁定</button>
</header>

<script>
"use strict";
(function () {
  const $ = id => document.getElementById(id);
  const payload = JSON.parse($("encryptedPayload").textContent);
  let activeUrl = null;
  let busy = false;
  let generation = 0;
  function decode(value) {
    return Uint8Array.from(atob(value), c => c.charCodeAt(0));
  }
  function error(message) {
    $("error").textContent = message;
    $("error").hidden = !message;
    $("password").setAttribute("aria-invalid", String(Boolean(message)));
  }
  function setBusy(value) {
    busy = value;
    $("unlock").disabled = value;
    $("password").disabled = value;
    $("togglePassword").disabled = value;
    $("unlock").textContent = value ? "正在解锁…" : "解锁资料 →";
  }
  function hidePassword() {
    $("password").type = "password";
    $("togglePassword").textContent = "显示";
    $("togglePassword").setAttribute("aria-label", "显示密码");
    $("togglePassword").setAttribute("aria-pressed", "false");
  }
  function lock(focus = true) {
    generation++;
    $("viewer").replaceChildren();
    $("viewer").hidden = true;
    $("toolbar").hidden = true;
    if (activeUrl) URL.revokeObjectURL(activeUrl);
    activeUrl = null;
    $("gate").hidden = false;
    $("password").value = "";
    hidePassword();
    error("");
    setBusy(false);
    document.title = "雪协面试资料 · 访问验证";
    $("status").textContent = "资料已锁定";
    if (focus) $("password").focus();
  }
  async function unlock(event) {
    event.preventDefault();
    if (busy) return;
    if (!$("password").value) { $("password").reportValidity(); return; }
    if (!window.isSecureContext || !window.crypto || !window.crypto.subtle) {
      error("当前浏览器无法解锁，请使用支持 HTTPS 的新版浏览器打开链接。");
      return;
    }
    if (payload.version !== 1 || payload.cipher !== "AES-GCM" ||
        payload.kdf !== "PBKDF2" || payload.hash !== "SHA-256" ||
        payload.iterations !== 600000 || payload.keyLength !== 256 || payload.tagLength !== 128) {
      error("文件格式异常，请联系资料提供者重新获取链接。");
      return;
    }
    const attempt = ++generation;
    error("");
    setBusy(true);
    try {
      const passwordBytes = new TextEncoder().encode($("password").value);
      const material = await crypto.subtle.importKey("raw", passwordBytes, "PBKDF2", false, ["deriveKey"]);
      passwordBytes.fill(0);
      const key = await crypto.subtle.deriveKey({
        name:"PBKDF2", salt:decode(payload.salt), iterations:payload.iterations, hash:payload.hash
      }, material, {name:"AES-GCM",length:256}, false, ["decrypt"]);
      const plaintext = await crypto.subtle.decrypt({
        name:"AES-GCM", iv:decode(payload.iv), tagLength:128
      }, key, decode(payload.ciphertext));
      if (attempt !== generation) return;
      $("password").value = "";
      hidePassword();
      // Chrome blocks declarative autofocus in an opaque-origin sandbox.
      // Keep the source file and encrypted bytes intact; adapt only the in-memory view.
      const source = new TextDecoder().decode(plaintext);
      const parsed = new DOMParser().parseFromString(source, "text/html");
      parsed.querySelectorAll("[autofocus]").forEach(element => element.removeAttribute("autofocus"));
      const url = URL.createObjectURL(new Blob(
        ["<!doctype html>\n" + parsed.documentElement.outerHTML],
        {type:"text/html;charset=utf-8"}
      ));
      new Uint8Array(plaintext).fill(0);
      activeUrl = url;
      const iframe = document.createElement("iframe");
      iframe.id = "interviewFrame";
      iframe.title = "面试人员总览";
      iframe.setAttribute("sandbox", "allow-scripts");
      iframe.setAttribute("referrerpolicy", "no-referrer");
      iframe.addEventListener("load", () => {
        if (attempt !== generation) return;
        setBusy(false);
        $("gate").hidden = true;
        $("toolbar").hidden = false;
        $("viewer").hidden = false;
        document.title = "26–27 骨干面试 · 人员总览";
        $("status").textContent = "资料已解锁";
        iframe.focus();
      }, {once:true});
      iframe.src = url;
      $("viewer").replaceChildren(iframe);
    } catch (_) {
      if (attempt !== generation) return;
      setBusy(false);
      error("无法解锁，请检查密码后重试。");
      $("password").value = "";
      $("password").focus();
    }
  }
  $("accessForm").addEventListener("submit", unlock);
  $("lock").addEventListener("click", () => lock());
  $("password").addEventListener("input", () => error(""));
  $("togglePassword").addEventListener("click", () => {
    const show = $("password").type === "password";
    $("password").type = show ? "text" : "password";
    $("togglePassword").textContent = show ? "隐藏" : "显示";
    $("togglePassword").setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
    $("togglePassword").setAttribute("aria-pressed", String(show));
  });
  window.addEventListener("pagehide", () => lock(false));
  window.addEventListener("pageshow", event => { if (event.persisted) lock(false); });
})();
</script>
</body>
</html>
